# To use:
#
#     pre-commit run -a
#
# Or:
#
#     pre-commit install
#
# To update this file:
#
#     pre-commit autoupdate

default_install_hook_types:
  - pre-commit
  - commit-msg

exclude: ^build/|^install/|^log/|^\.vscode/

repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: check-added-large-files
        # 25600 KiB = 25 MiB; interface documentation may contain maintained images.
        args: [--maxkb=25600]
      - id: check-case-conflict
      - id: check-merge-conflict
      - id: check-symlinks
      - id: check-xml
      - id: detect-private-key
      - id: end-of-file-fixer
        exclude_types: [svg]
      - id: mixed-line-ending
        # Use one deterministic line ending instead of preserving each file's majority style.
        args: [--fix=lf]
      - id: trailing-whitespace
        exclude_types: [svg]
      - id: fix-byte-order-marker
      - id: no-commit-to-branch
        args:
          - --branch=main
          - --branch=master

  - repo: local
    hooks:
      - id: ament_lint_cmake
        name: ament_lint_cmake
        description: Validate CMakeLists.txt with the ROS 2 CMake linter.
        entry: ament_lint_cmake
        language: system
        files: CMakeLists\.txt$

      - id: ament_xmllint
        name: ament_xmllint
        description: Validate XML files with the ROS 2 XML wrapper.
        entry: ament_xmllint
        language: system
        types: [xml]

  - repo: https://github.com/compilerla/conventional-pre-commit
    rev: v4.4.0
    hooks:
      - id: conventional-pre-commit
        stages: [commit-msg]
        args:
          - --verbose
          - build
          - chore
          - ci
          - docs
          - feat
          - fix
          - perf
          - refactor
          - revert
          - style
          - test
